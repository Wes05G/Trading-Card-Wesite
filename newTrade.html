<html>
<head>
    <link rel="stylesheet" href="Style.css">
    <title>MintPick - The Trading Card Marketplace!</title>
</head>
<body>
     <header class="site-header">
        <div class="header-left">
            <a href="index.html"><img src="Images/MintPick Logo .png" alt="MintPick Logo" width="100" height="100"></a>
            <h1>MintPick - The Trading Card Marketplace!</h1>
        </div>
        <div class="header-right">
            <button class="button login-button" onclick="location.href='login.html'">Login</button>
        </div>
    </header>
    <nav class="navbar">
            <ul>
                <li><a href="trades.html">Trades</a></li>
                <li><a href="newTrade.html"> Start Trade!</a></li>
                <li><a href="">Pending Trades</a></li>
                <li class="push-right"><a href="">Login</a></li>
            </ul>
    </nav>

    <main>
        <form action="/trades.html" method="post">
            <label for="tcname">Type of Card:</label><br>
            <input type="text" id="tcname" name="tcname"><br>
            <label for="sibtname">Set it belongs to:</label><br>
            <input type="text" id="sibtname" name="sibtname"><br>
            <label for="cname">Name of Card:</label><br>
            <input type="text" id="cname" name="cname"><br>
            <label for="grade">Grade:</label><br>
            <input type="text" id="grade" name="grade"><br>
            <label for="price">Price:</label><br>
            <input type="text" id="price" name="price"><br>
            <label for="status">Status:</label><br>
            <input type="text" id="status" name="status"><br>
            <label for="image">Image URL:</label><br>
            <input type="text" id="image" name="image"><br>
            <input type="submit" value="Submit">
        </form>
        <button class="back-button" onclick="window.history.back();">← Back</button>
    </main>

 <footer>
        <ul class="footer-links">
            <li><a href="">About</a></li>
            <li><a href="">Contact</a></li>
        </ul>
        <div class="footer-right">
            <a href=""><img src="Images/Instagram.jpg" alt="Instagram Logo" width="30" height="30"></a>
            <a href=""><img src="Images/X.jpg" alt="X Logo" width="30" height="30"></a>
            <a href=""><img src="Images/Facebook.png" alt="Facebook Logo" width="30" height="30"></a>
        </div>

    </footer>
</body>
</html>
