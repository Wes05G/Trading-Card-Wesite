<html>
<head>
    <link rel="stylesheet" href="Style.css">
    <title>MintPick - Card Details</title>
</head>
<body>
    <h1>
         <a href="index.html"><img src="Images/MintPick Logo .png" alt="MintPick Logo" width="150" height="150"></a>
    MintPick - The Trading Card Marketplace!
    </h1>
    <nav class="navbar">
            <ul>
                <li><a href="trades.html">Trades</a></li>
                <li><a href="newTrade.html"> Start Trade!</a></li>
                <li><a href="">Pending Trades</a></li>
                <li class="push-right"><a href="">Login</a></li>
            </ul>
    </nav>

    <main class="card-container">
        <button class="back-button" onclick="window.history.back();">← Back</button>

        <h2>Card Details</h2>
        <img id="cardImage" src="" alt="Card Image" width="200" height="250">
        <div class="card-info">
            <p id="cardName"></p>
            <p id="cardDescription"></p>
            <p id="cardGrade"></p>
            <p id="cardPrice"></p>
            <p id="status"></p>
        </div>
    </main>

    <footer>
        <ul>
        <li><a href="">About</a></li>
        <li><a href="">Contact</a></li>
        </ul>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const cardName = params.get('name');
        const cardGrade = params.get('grade');
        const cardPrice = params.get('price');
        const cardImage = params.get('image');
        const cardStatus = params.get('status');

        document.getElementById('cardImage').src = cardImage ? 'Images/' + cardImage : '';
        document.getElementById('cardName').textContent = cardName || 'Card Name';
        document.getElementById('cardGrade').textContent = 'PSA Grade: ' + (cardGrade || 'N/A');
        document.getElementById('cardPrice').textContent = 'Price: $' + (cardPrice || '0.00');
        document.getElementById('status').textContent = 'Status: ' + (cardStatus || 'Available');
    </script>
</body>
</html>
